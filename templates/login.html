<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Cirugías Cardiovasculares</title>
    <link rel="shortcut icon" href="../static/gqg ICN.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(220, 38, 38, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(220, 38, 38, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(220, 38, 38, 0.1);
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            border-radius: 20px 20px 0 0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            margin: 0 auto 25px;
            position: relative;
            width: 100px;
            height: 100px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 
                0 10px 30px rgba(220, 38, 38, 0.3),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
        }

        .logo svg {
            width: 55px;
            height: 55px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .login-header h1 {
            color: #1a1a1a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #666;
            font-size: 15px;
            font-weight: 400;
        }

        .subtitle {
            color: #dc2626;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #1a1a1a;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #dc2626;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
        }

        input[type="password"]::placeholder {
            color: #999;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.4);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            color: #991b1b;
            padding: 14px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #dc2626;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-message::before {
            content: '⚠';
            font-size: 18px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .footer strong {
            color: #666;
            font-weight: 600;
        }

        /* Animación de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeInUp 0.6s ease-out;
        }

        /* Pulso sutil en el logo */
        @keyframes pulse {
            0%, 100% {
                box-shadow: 
                    0 10px 30px rgba(220, 38, 38, 0.3),
                    inset 0 -2px 10px rgba(0, 0, 0, 0.2);
            }
            50% {
                box-shadow: 
                    0 10px 40px rgba(220, 38, 38, 0.4),
                    inset 0 -2px 10px rgba(0, 0, 0, 0.2);
            }
        }

        .logo {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-container">
                <div class="logo">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <!-- Corazón estilizado médico -->
                        <path d="M50 85 C30 70, 15 55, 15 40 C15 25, 25 15, 35 15 C42 15, 47 20, 50 25 C53 20, 58 15, 65 15 C75 15, 85 25, 85 40 C85 55, 70 70, 50 85 Z" 
                              fill="white" 
                              opacity="0.95"/>
                        <!-- Línea de ECG integrada -->
                        <path d="M20 50 L30 50 L35 35 L40 65 L45 45 L50 50 L80 50" 
                              stroke="white" 
                              stroke-width="2.5" 
                              fill="none" 
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              opacity="0.9"/>
                    </svg>
                </div>
            </div>
            <div class="subtitle">Sistema Médico</div>
            <h1>Cirugías Cardiovasculares</h1>
            <p>Gestión Quirúrgica de Excelencia</p>
        </div>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="password">Contraseña de Acceso</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Ingresa tu contraseña segura"
                        required
                        autofocus
                    >
                </div>
            </div>

            <button type="submit" class="btn-login">
                Ingresar al Sistema
            </button>
        </form>

        <div class="footer">
            <strong>Sistema de Registro Quirúrgico</strong><br>
            Cardiovascular · Seguro · Profesional
        </div>
    </div>

    <script>
        document.getElementById('password').focus();
        
        // Prevenir copiar/pegar en producción si es necesario
        // document.getElementById('password').addEventListener('paste', e => e.preventDefault());
    </script>
</body>
</html>
